# GitHub Actions: build release binaries for all platforms (save as .github/workflows/build.yml).
# Native runners where possible (most reliable), cross tools for the rest.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  tool: zigbuild }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  tool: zigbuild }
          - { target: x86_64-apple-darwin,        os: macos-latest,   tool: cargo }
          - { target: aarch64-apple-darwin,       os: macos-latest,   tool: cargo }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, tool: cargo }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest, tool: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        run: pip install ziglang && cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.tool }}" = zigbuild ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} -p ex021-cross-compilation
          else
            cargo build --release --locked --target ${{ matrix.target }} -p ex021-cross-compilation
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: platctl-sysinfo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/platctl-sysinfo*
