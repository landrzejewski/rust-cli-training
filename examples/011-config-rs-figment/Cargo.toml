[package]
name = "ex011-config-rs-figment"
description = "platctl-settings: layered configuration with config-rs and figment, dotenvy, serde"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "platctl-settings"
path = "src/main.rs"

[dependencies]
figment = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# `test` feature: `figment::Jail` – isolated env vars / files for tests.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
