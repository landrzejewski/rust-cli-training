# cargo-release configuration for this package (https://github.com/crate-ci/cargo-release).
#   cargo release patch            # dry run: shows what would happen
#   cargo release patch --execute  # bump 0.3.0 -> 0.3.1, update CHANGELOG, commit, tag, push
#
# The tag triggers the cargo-dist release workflow (CI builds and publishes the artifacts).

# Workspace with independent examples: one tag per package.
tag-name = "{{crate_name}}-v{{version}}"
# Not published to crates.io (dist publishes binaries to GitHub Releases).
publish = false
# Use `git push --follow-tags` semantics; set to false to push manually.
push = true
# Commit message of the version bump.
pre-release-commit-message = "chore(release): {{crate_name}} {{version}}"
# Only release from the default branch.
allow-branch = ["main"]

# Keep the changelog in sync: move "Unreleased" into a versioned section.
[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1
