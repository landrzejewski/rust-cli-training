[package]
name = "platctl-ext-api"
description = "C ABI shared by platctl-ext and its native plugins"
edition.workspace = true
version = "0.1.0"
license.workspace = true
publish.workspace = true

# `unsafe` is the point of this crate (FFI), so it cannot inherit the workspace `forbid`.
# Same lints otherwise, plus: every unsafe block must carry a `// SAFETY:` justification.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
