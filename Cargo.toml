# Cargo workspace: every example is an independent crate in `examples/` (one per training topic).
# Run one with: cargo run -p ex001-cli-conventions -- --help
[workspace]
resolver = "3"
members = ["examples/*"]

# Shared package metadata – examples inherit it with `edition.workspace = true` etc.
[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# Lints shared by all examples (`[lints] workspace = true` in each crate).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Dependency versions declared once; examples use `dep = { workspace = true }`.
# Kept as the last section of this file.
[workspace.dependencies]
age = "0.12.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string", "env"] }
clap-markdown = "0.1.5"
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
comfy-table = "8.0.1"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
keyring = "4.2.0"
nu-ansi-term = "0.50.3"
owo-colors = "4.4.0"
ratatui = "0.30.2"
rpassword = "7.5.4"
secrecy = "0.10.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = "0.7.19"
toml = "1.1.6"
