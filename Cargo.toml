# Cargo workspace: every example is an independent crate in `examples/` (one per training topic).
# Run one with: cargo run -p ex001-cli-conventions -- --help
[workspace]
resolver = "3"
members = ["examples/*"]

# Shared package metadata – examples inherit it with `edition.workspace = true` etc.
[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# Lints shared by all examples (`[lints] workspace = true` in each crate).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Dependency versions declared once; examples use `dep = { workspace = true }`.
# Kept as the last section of this file.
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string"] }
comfy-table = "8.0.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
nu-ansi-term = "0.50.3"
owo-colors = "4.4.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = "0.7.19"
toml = "1.1.6"
